# Load Balancer config
lb.port=12345

# Worker list file
worker.list=worker_list.txt

# PostgreSQL database config
db.url=jdbc:postgresql://localhost:5433/students
db.user=postgres
db.password=postgres123

# Health check interval in seconds
healthcheck.interval=5

# Connection pool size per worker (Enhancement 3)
# Increased to 20 now that PostgreSQL max_connections = 200
# 5 workers × 20 connections = 100 total (leaves 100 headroom)
db.pool.size=20
